<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Focus Meter Pro</title>
    <!-- Favicon intégré -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='40' fill='none' stroke='%23ffffff' stroke-width='8'/><line x1='50' y1='50' x2='50' y2='30' stroke='%23ffffff' stroke-width='8'/></svg>">
    <!-- Chart.js pour les graphiques -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* Variables de Thème (Thème Sombre par défaut) */
        :root { 
            --bg: #121212; 
            --panel: #1e1e1e; 
            --text: #ffffff; 
            --muted: #888888; 
            --p1: #FF4D4D; 
            --p2: #FF9F43; 
            --p3: #F1C40F; 
            --p4: #2ECC71; 
            --rem: #2c2c2c;
            --border: #444444;
            --shadow: 0 12px 36px rgba(0,0,0,0.6);
            --chart-line: #3498db;
            --chart-ideal: #777777;
        }

        /* Thème Camouflage (Blanc & Gris) */
        body.light-theme {
            --bg: #ffffff;
            --panel: #ffffff;
            --text: #8a8a8a;
            --muted: #cccccc;
            --p1: #666666; 
            --p2: #949494; 
            --p3: #c2c2c2; 
            --p4: #e0e0e0; 
            --rem: #f5f5f5; 
            --border: #eeeeee;
            --shadow: none; 
            --chart-line: #8a8a8a;
            --chart-ideal: #dddddd;
        }

        body { 
            font-family: 'Segoe UI', sans-serif; 
            background: var(--bg); 
            color: var(--text); 
            margin: 0; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            width: 100vw;
            overflow: hidden; 
            box-sizing: border-box;
            padding: 0;
            transition: background 0.3s;
        }
        
        /* Conteneur 100% fluide et débloqué */
        .app-container { 
            width: 100vw; 
            height: 100vh; 
            background: var(--panel); 
            padding: 4vmin; 
            box-sizing: border-box; 
            display: flex; 
            flex-direction: column;
            justify-content: space-between;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            transition: all 0.3s ease;
            overflow: hidden;
            min-width: 0 !important; /* Débloque la réduction sous Chromium */
            min-height: 0 !important;
        }

        #mainView { display: flex; flex-direction: column; justify-content: space-between; height: 100%; width: 100%; min-width: 0; }
        #statsView { display: none; flex-direction: column; height: 100%; width: 100%; min-width: 0; }

        .timer-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.5vmin; width: 100%; min-width: 0; }
        
        /* Chiffres du timer ultra-adaptatifs */
        #timer { 
            font-size: 10vmin; 
            font-weight: bold; 
            font-variant-numeric: tabular-nums; 
            line-height: 1;
        }
        
        #dayTotal { font-size: 4vmin; font-weight: bold; margin-top: 0.5vmin; }
        #estimatedEnd { font-size: 2.5vmin; color: var(--muted); margin-top: 0.5vmin; font-style: italic; }
        
        /* Barre d'avancement */
        .progress-wrapper { height: 2vmin; background: var(--rem); border-radius: 1vmin; margin: 1.5vmin 0; overflow: hidden; display: flex; width: 100%; }
        .segment { height: 100%; transition: width 0.3s; }
        
        /* Grille des boutons adaptative */
        .controls-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1.5vmin; margin-bottom: 2vmin; width: 100%; }
        .p-btn { border: 1px solid var(--border); background: transparent; color: var(--muted); padding: 2vmin 0; border-radius: 1.5vmin; cursor: pointer; font-size: 3vmin; transition: all 0.2s; font-weight: bold; min-width: 0; }
        .p-btn.active { color: white; border-color: transparent; }
        body.light-theme .p-btn.active { color: #333; }

        .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 2.5vmin; width: 100%; }
        button.action { padding: 3vmin; border: 1px solid var(--border); border-radius: 2vmin; font-weight: bold; cursor: pointer; font-size: 3.2vmin; color: var(--text); background: var(--panel); transition: background 0.2s; min-width: 0; }
        #startStopBtn { background: var(--p4); color: var(--bg); border: none; }
        
        /* Inputs stylisés */
        .theme-input {
            width: 7vmin; 
            background: var(--rem); 
            border: 1px solid var(--border); 
            color: var(--text); 
            border-radius: 1vmin; 
            text-align: center; 
            padding: 0.5vmin; 
            font-size: 2.5vmin;
            font-family: inherit;
        }

        /* Interrupteur iOS miniature */
        .switch-container { display: flex; align-items: center; gap: 1vmin; margin-top: 1vmin; }
        .switch { position: relative; display: inline-block; width: 6vmin; height: 3.5vmin; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #444; transition: .3s; border-radius: 3vmin; }
        .slider:before { position: absolute; content: ""; height: 2.5vmin; width: 2.5vmin; left: 0.5vmin; bottom: 0.5vmin; background-color: white; transition: .3s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--p2); }
        input:checked + .slider:before { transform: translateX(2.5vmin); }
        body.light-theme .slider { background-color: #ddd; }

        /* Masquage automatique du texte si la fenêtre est trop petite */
        @media (max-width: 180px), (max-height: 180px) {
            .switch-container span, #estimatedEnd, .obj-text { display: none !important; }
            .p-btn { padding: 1vmin 0; }
        }

        /* Zone d'analyse */
        .nav-tabs { display: flex; gap: 1.5vmin; margin-bottom: 2vmin; width: 100%; }
        .nav-btn { flex: 1; padding: 2vmin; font-size: 2.8vmin; background: var(--rem); color: var(--text); border: 1px solid var(--border); border-radius: 1.5vmin; cursor: pointer; font-weight: bold; min-width: 0; }
        .nav-btn.active { background: var(--p4); color: var(--bg); border: none; }
        
        .stats-scroll { flex: 1; overflow-y: auto; padding-right: 1vmin; margin-top: 2vmin; display: flex; flex-direction: column; gap: 3vmin; min-width: 0; }
        
        /* Conteneurs de graphiques débloqués avec position absolute */
        .canvas-wrapper { 
            position: relative; 
            width: 100%; 
            height: 35vmin; 
            flex-shrink: 0; 
            min-width: 0 !important;
            min-height: 0 !important;
        }
        .canvas-wrapper canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100% !important;
            height: 100% !important;
        }
        
        /* Calendrier */
        .calendar-header { display: grid; grid-template-columns: repeat(7, 1fr); gap: 1vmin; text-align: center; font-size: 2.5vmin; color: var(--muted); margin-bottom: 1.5vmin; }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 1vmin; width: 100%; }
        .day-cell { position: relative; aspect-ratio: 1; background: var(--rem); border-radius: 1.5vmin; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 1vmin 0; box-sizing: border-box; border: 1px solid var(--border); }
        .day-num { font-size: 2.2vmin; font-weight: bold; color: var(--text); }
        .mini-pie { width: 4vmin; height: 4vmin; border-radius: 50%; background: var(--border); }
        
        .session-item { display: flex; justify-content: space-between; font-size: 2.8vmin; border-bottom: 1px solid var(--border); padding: 1.5vmin 0; }
        .session-priority { font-weight: bold; padding: 0.5vmin 1.5vmin; border-radius: 1vmin; font-size: 2.2vmin; color: white; }
        body.light-theme .session-priority { color: #333; }
    </style>
</head>
<body>

<div class="app-container">
    <!-- VUE PRINCIPALE -->
    <div id="mainView">
        <div class="timer-row">
            <div>
                <div style="font-size: 2.8vmin; color: var(--muted); display: flex; align-items: center; gap: 1vmin;">
                    <span class="obj-text">OBJECTIF</span> 
                    <input type="number" id="goalInput" min="1" max="24" value="7" class="theme-input" onchange="updateGoal(this.value)">H
                </div>
                <div id="dayTotal">00:00:00</div>
                <div id="estimatedEnd">Fin estimée : --:--</div>
            </div>
            <div style="display: flex; flex-direction: column; align-items: flex-end;">
                <div id="timer">00:00:00</div>
                <!-- Interrupteur iOS thème discret -->
                <div class="switch-container">
                    <span>Discret</span>
                    <label class="switch">
                        <input type="checkbox" id="themeToggle" onchange="toggleTheme(this.checked)">
                        <span class="slider"></span>
                    </label>
                </div>
            </div>
        </div>
        <div class="progress-wrapper" id="progressBar"></div>
        <div style="text-align: right; font-size: 2.5vmin; color: var(--muted);" id="percText">0%</div>
        <div class="controls-grid" id="priorityGrid">
            <button class="p-btn" onclick="setPriority(1)">P1</button>
            <button class="p-btn" onclick="setPriority(2)">P2</button>
            <button class="p-btn" onclick="setPriority(3)">P3</button>
            <button class="p-btn active" onclick="setPriority(4)">P4</button>
        </div>
        <div class="actions">
            <button id="startStopBtn" class="action" onclick="toggleTimer()">START</button>
            <button class="action" onclick="showStats()">ANALYSE</button>
        </div>
    </div>

    <!-- VUE STATS -->
    <div id="statsView" class="stats-view">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 2vmin;">
            <h3 style="margin:0; font-size:4.5vmin;">Analyse</h3>
            <button onclick="hideStats()" style="background:none; border:none; color:var(--text); cursor:pointer; font-size:4.5vmin;">✕</button>
        </div>
        <div class="nav-tabs">
            <button id="tab-day" class="nav-btn active" onclick="changeView('day')">Jour</button>
            <button id="tab-week" class="nav-btn" onclick="changeView('week')">Semaine</button>
            <button id="tab-month" class="nav-btn" onclick="changeView('month')">Mois</button>
        </div>
        
        <div style="display: flex; gap: 2vmin; align-items: center; margin-bottom: 2vmin; flex-shrink: 0;">
            <input type="date" id="dateSelector" onchange="renderCharts()" style="flex: 1; background:var(--rem); color:var(--text); border:1px solid var(--border); padding:1.5vmin; border-radius:1vmin; font-size:2.8vmin; font-family: inherit;">
            <div id="startHourContainer" style="font-size:2.5vmin; color:var(--muted); white-space:nowrap;">
                Début : <input type="number" id="startHourInput" min="0" max="23" value="9" class="theme-input" style="width:7vmin;" onchange="updateStartHour(this.value)">H
            </div>
        </div>
        
        <div class="stats-scroll">
            <div class="canvas-wrapper" id="pieWrapper">
                <canvas id="myChart"></canvas>
            </div>
            <div class="canvas-wrapper" id="sCurveWrapper">
                <canvas id="sCurveChart"></canvas>
            </div>
            
            <div id="calendarContainer" style="display:none; width: 100%;">
                <div class="calendar-header">
                    <span>Lu</span><span>Ma</span><span>Me</span><span>Je</span><span>Ve</span><span>Sa</span><span>Di</span>
                </div>
                <div id="monthGrid" class="calendar-grid"></div>
            </div>
            <div id="sessionsListContainer"></div>
        </div>
    </div>
</div>

<script>
    let timerInterval, startTime, elapsed = 0, isRunning = false, currentPriority = 4, currentView = 'day', myChart = null, sCurveChart = null;
    let sessions = JSON.parse(localStorage.getItem('focusSessions') || '[]');
    let dailyGoalHours = parseInt(localStorage.getItem('focusDailyGoal') || '7');
    let dayStartHour = parseInt(localStorage.getItem('focusStartHour') || '9');

    document.getElementById('goalInput').value = dailyGoalHours;
    document.getElementById('startHourInput').value = dayStartHour;

    // Récupération des couleurs CSS dynamiquement
    function getThemeColor(varName) {
        return getComputedStyle(document.body).getPropertyValue(varName).trim();
    }

    // Gestion du thème blanc/noir
    function toggleTheme(isLight) {
        document.body.classList.toggle('light-theme', isLight);
        localStorage.setItem('focusTheme', isLight ? 'light' : 'dark');
        
        updateDayStats();
        setPriority(currentPriority);
        
        // Actualiser le bouton Start/Stop
        const btn = document.getElementById('startStopBtn');
        if (isRunning) {
            btn.style.background = "#555";
        } else {
            btn.style.background = `var(--p${currentPriority})`;
        }

        if (document.getElementById('statsView').style.display === 'flex') {
            renderCharts();
        }
    }

    function updateGoal(val) {
        let parsed = parseInt(val);
        if (isNaN(parsed) || parsed < 1) parsed = 1;
        if (parsed > 24) parsed = 24;
        dailyGoalHours = parsed;
        localStorage.setItem('focusDailyGoal', parsed);
        document.getElementById('goalInput').value = parsed;
        updateDayStats();
    }

    function updateStartHour(val) {
        let parsed = parseInt(val);
        if (isNaN(parsed) || parsed < 0) parsed = 0;
        if (parsed > 23) parsed = 23;
        dayStartHour = parsed;
        localStorage.setItem('focusStartHour', parsed);
        document.getElementById('startHourInput').value = parsed;
        if (currentView === 'day') renderCharts();
    }

    function formatDuration(sec) {
        const h = Math.floor(sec / 3600);
        const m = Math.floor((sec % 3600) / 60);
        if (h > 0) return `${h}h ${m}m`;
        return `${m}m ${Math.floor(sec % 60)}s`;
    }

    function setPriority(p) {
        currentPriority = p;
        document.querySelectorAll('.p-btn').forEach((b, i) => {
            b.classList.toggle('active', i+1 === p);
            b.style.backgroundColor = (i+1 === p) ? `var(--p${p})` : 'transparent';
        });
    }

    function toggleTimer() {
        const btn = document.getElementById('startStopBtn');
        if (!isRunning) {
            startTime = Date.now() - elapsed;
            timerInterval = setInterval(updateDisplay, 1000);
            btn.textContent = "STOP"; btn.style.background = "#555"; isRunning = true;
        } else {
            clearInterval(timerInterval); isRunning = false;
            sessions.push({ date: Date.now(), duration: elapsed / 1000, priority: currentPriority });
            localStorage.setItem('focusSessions', JSON.stringify(sessions));
            elapsed = 0; updateDisplay(); btn.textContent = "START"; btn.style.background = `var(--p${currentPriority})`;
        }
    }

    function updateDisplay() {
        if(isRunning) elapsed = Date.now() - startTime;
        const h = Math.floor(elapsed / 3600000), m = Math.floor((elapsed % 3600000) / 60000), s = Math.floor((elapsed % 60000) / 1000);
        document.getElementById('timer').textContent = `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
        updateDayStats();
    }

    function updateDayStats() {
        const today = new Date().toDateString();
        const dailySessions = sessions.filter(s => new Date(s.date).toDateString() === today);
        const totalSec = dailySessions.reduce((acc, s) => acc + s.duration, 0) + (isRunning ? elapsed/1000 : 0);
        
        const h = Math.floor(totalSec / 3600), m = Math.floor((totalSec % 3600) / 60), s = Math.floor(totalSec % 60);
        document.getElementById('dayTotal').textContent = `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
        
        const goalSeconds = dailyGoalHours * 3600;
        document.getElementById('percText').textContent = Math.min((totalSec / goalSeconds) * 100, 100).toFixed(1) + "%";
        
        const remainingSec = Math.max(0, goalSeconds - totalSec);
        const estEndEl = document.getElementById('estimatedEnd');
        
        if (remainingSec <= 0) {
            estEndEl.textContent = "Objectif atteint !";
        } else {
            const now = new Date();
            let estimatedEndTime = new Date(now.getTime() + remainingSec * 1000);
            
            const lunchLimit = new Date(now);
            lunchLimit.setHours(12, 30, 0, 0);
            
            if (now < lunchLimit && estimatedEndTime > lunchLimit) {
                estimatedEndTime = new Date(estimatedEndTime.getTime() + 3600 * 1000);
            }
            
            const timeStr = estimatedEndTime.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            estEndEl.textContent = `Fin estimée : ${timeStr}`;
        }

        const bar = document.getElementById('progressBar');
        bar.innerHTML = '';
        [1,2,3,4].forEach(p => {
            const pSec = dailySessions.filter(s => s.priority === p).reduce((a,s) => a + s.duration, 0);
            if (pSec > 0) {
                const seg = document.createElement('div'); seg.className = 'segment'; 
                seg.style.width = (pSec / goalSeconds * 100) + '%'; 
                seg.style.backgroundColor = `var(--p${p})`; bar.appendChild(seg);
            }
        });
    }

    function changeView(view) {
        currentView = view;
        document.querySelectorAll('.nav-btn').forEach(b => {
            b.classList.toggle('active', b.id === `tab-${view}`);
        });
        document.getElementById('startHourContainer').style.display = (view === 'day') ? 'block' : 'none';
        renderCharts();
    }

    function getTheoreticalFocusAt(t) {
        if (t <= dayStartHour) return 0;
        let activeWorkTime = 0;
        let lunchStart = 12.5;
        let lunchEnd = 13.5;
        let hasLunch = (dayStartHour < lunchStart);

        if (hasLunch) {
            if (t <= lunchStart) activeWorkTime = t - dayStartHour;
            else if (t <= lunchEnd) activeWorkTime = lunchStart - dayStartHour;
            else activeWorkTime = (t - dayStartHour) - 1.0;
        } else {
            activeWorkTime = t - dayStartHour;
        }
        return Math.max(0, Math.min(dailyGoalHours, activeWorkTime));
    }

    function renderCharts() {
        if (myChart) myChart.destroy();
        if (sCurveChart) sCurveChart.destroy();
        
        const ctx = document.getElementById('myChart').getContext('2d');
        const sCtx = document.getElementById('sCurveChart').getContext('2d');
        const listContainer = document.getElementById('sessionsListContainer');
        const calContainer = document.getElementById('calendarContainer');
        const pieWrapper = document.getElementById('pieWrapper');
        const sCurveWrapper = document.getElementById('sCurveWrapper');
        
        listContainer.innerHTML = '';
        calContainer.style.display = 'none';
        pieWrapper.style.display = 'block';
        sCurveWrapper.style.display = 'none';

        const selectedDateStr = document.getElementById('dateSelector').value || new Date().toISOString().split('T')[0];
        const selectedDate = new Date(selectedDateStr);

        // Couleurs de thème récupérées dynamiquement
        const colorP1 = getThemeColor('--p1');
        const colorP2 = getThemeColor('--p2');
        const colorP3 = getThemeColor('--p3');
        const colorP4 = getThemeColor('--p4');
        const colorRem = getThemeColor('--rem');
        const colorLine = getThemeColor('--chart-line');
        const colorIdeal = getThemeColor('--chart-ideal');

        if (currentView === 'day') {
            sCurveWrapper.style.display = 'block';
            const daySess = sessions.filter(s => new Date(s.date).toISOString().split('T')[0] === selectedDateStr);
            const data = [1,2,3,4].map(p => daySess.filter(s => s.priority === p).reduce((a,s) => a+s.duration, 0));
            const totalWorked = data.reduce((a,b)=>a+b,0);
            const goalSeconds = dailyGoalHours * 3600;
            const remaining = Math.max(0, goalSeconds - totalWorked);
            data.push(remaining);

            // 1. Camembert
            myChart = new Chart(ctx, {
                type: 'pie',
                data: {
                    labels: ['P1', 'P2', 'P3', 'P4', 'Reste'],
                    datasets: [{
                        data: data.map(s => (s/60).toFixed(1)),
                        backgroundColor: [colorP1, colorP2, colorP3, colorP4, colorRem]
                    }]
                },
                options: { 
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { position: 'right', labels: { color: getThemeColor('--text'), boxWidth: 10, font: { size: 9 } } } } 
                }
            });

            // 2. S-Curve
            const labels = [];
            const theoreticalData = [];
            const actualData = [];
            
            let lunchIncluded = (dayStartHour < 12.5);
            let theoreticalTotalElapsed = dailyGoalHours + (lunchIncluded ? 1 : 0);
            let endHour = Math.max(dayStartHour + theoreticalTotalElapsed + 0.5, 18);

            for (let t = dayStartHour; t <= endHour; t += 0.5) {
                let h = Math.floor(t);
                let m = (t % 1 === 0) ? "00" : "30";
                labels.push(`${String(h).padStart(2, '0')}:${m}`);
                
                theoreticalData.push(getTheoreticalFocusAt(t));

                const limitTime = new Date(selectedDate);
                limitTime.setHours(h, (t % 1 === 0) ? 0 : 30, 0, 0);
                
                const actualSecAtT = daySess
                    .filter(s => new Date(s.date) <= limitTime)
                    .reduce((sum, s) => sum + s.duration, 0);

                const now = new Date();
                if (selectedDate.toDateString() === now.toDateString() && limitTime > now) {
                    actualData.push(null);
                } else {
                    actualData.push(actualSecAtT / 3600);
                }
            }

            sCurveChart = new Chart(sCtx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [
                        {
                            label: 'Réalisé',
                            data: actualData,
                            borderColor: colorLine,
                            backgroundColor: 'rgba(120, 120, 120, 0.05)',
                            borderWidth: 2,
                            fill: true,
                            tension: 0.1,
                            spanGaps: false
                        },
                        {
                            label: 'Théorique (Idéal)',
                            data: theoreticalData,
                            borderColor: colorIdeal,
                            borderDash: [5, 5],
                            borderWidth: 1.5,
                            fill: false,
                            tension: 0
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        x: { ticks: { color: getThemeColor('--text'), font: { size: 8 } }, grid: { display: false } },
                        y: { ticks: { color: getThemeColor('--text'), font: { size: 8 } }, grid: { color: getThemeColor('--border') }, title: { display: true, text: 'Heures', color: getThemeColor('--muted'), font: { size: 8 } } }
                    },
                    plugins: {
                        legend: { position: 'top', labels: { color: getThemeColor('--text'), boxWidth: 10, font: { size: 8 } } }
                    }
                }
            });

            // Liste des sessions
            if (daySess.length > 0) {
                listContainer.innerHTML = '<h4 style="margin:10px 0 5px 0; font-size:12px;">Sessions du jour</h4>';
                daySess.forEach((s, idx) => {
                    const timeStr = new Date(s.date).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                    listContainer.innerHTML += `
                        <div class="session-item">
                            <span>Session #${idx+1} à ${timeStr}</span>
                            <span class="session-priority" style="background: var(--p${s.priority})">P${s.priority}</span>
                            <span>${formatDuration(s.duration)}</span>
                        </div>`;
                });
            } else {
                listContainer.innerHTML = '<div style="font-size:11px; color:var(--muted); text-align:center;">Aucune session enregistrée pour ce jour.</div>';
            }

        } else if (currentView === 'week') {
            const labels = [];
            const dataP1 = [], dataP2 = [], dataP3 = [], dataP4 = [];
            
            for (let i = 6; i >= 0; i--) {
                const d = new Date(selectedDate);
                d.setDate(selectedDate.getDate() - i);
                const dStr = d.toDateString();
                const dayLabel = d.toLocaleDateString([], { weekday: 'short', day: 'numeric' });
                labels.push(dayLabel);

                const daySess = sessions.filter(s => new Date(s.date).toDateString() === dStr);
                dataP1.push(daySess.filter(s => s.priority === 1).reduce((a,s)=>a+s.duration,0)/3600);
                dataP2.push(daySess.filter(s => s.priority === 2).reduce((a,s)=>a+s.duration,0)/3600);
                dataP3.push(daySess.filter(s => s.priority === 3).reduce((a,s)=>a+s.duration,0)/3600);
                dataP4.push(daySess.filter(s => s.priority === 4).reduce((a,s)=>a+s.duration,0)/3600);
            }

            myChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [
                        { label: 'P1', data: dataP1, backgroundColor: colorP1 },
                        { label: 'P2', data: dataP2, backgroundColor: colorP2 },
                        { label: 'P3', data: dataP3, backgroundColor: colorP3 },
                        { label: 'P4', data: dataP4, backgroundColor: colorP4 }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        x: { stacked: true, grid: { display: false }, ticks: { color: getThemeColor('--text'), font: { size: 8 } } },
                        y: { stacked: true, grid: { color: getThemeColor('--border') }, ticks: { color: getThemeColor('--text'), font: { size: 8 } } }
                    },
                    plugins: { legend: { display: false } }
                }
            });

            const totalWeekSec = sessions.filter(s => {
                const diffTime = Math.abs(selectedDate - new Date(s.date));
                const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                return diffDays <= 7;
            }).reduce((a,s)=>a+s.duration, 0);

            listContainer.innerHTML = `<div style="font-size:11px; color:var(--muted); text-align:center; margin-top:5px;">Total concentré (7 jours) : <b>${formatDuration(totalWeekSec)}</b></div>`;

        } else if (currentView === 'month') {
            pieWrapper.style.display = 'none';
            calContainer.style.display = 'block';
            
            const grid = document.getElementById('monthGrid');
            grid.innerHTML = '';
            
            const year = selectedDate.getFullYear();
            const month = selectedDate.getMonth();
            
            const firstDayIndex = new Date(year, month, 1).getDay(); 
            const startingOffset = (firstDayIndex + 6) % 7;
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            
            for (let x = 0; x < startingOffset; x++) {
                grid.innerHTML += `<div style="height:32px;"></div>`;
            }
            
            const goalSeconds = dailyGoalHours * 3600;

            for (let day = 1; day <= daysInMonth; day++) {
                const dayDate = new Date(year, month, day);
                const daySess = sessions.filter(s => new Date(s.date).toDateString() === dayDate.toDateString());
                
                let gradientStr = 'var(--rem)';
                const totalWorked = daySess.reduce((acc, s)=>acc+s.duration, 0);

                if (totalWorked > 0) {
                    let acc = 0;
                    const segments = [1,2,3,4].map(p => {
                        const dur = daySess.filter(s => s.priority === p).reduce((a,s)=>a+s.duration,0);
                        if (dur === 0) return null;
                        const start = (acc / Math.max(goalSeconds, totalWorked)) * 100;
                        acc += dur;
                        const end = (acc / Math.max(goalSeconds, totalWorked)) * 100;
                        return `var(--p${p}) ${start}% ${end}%`;
                    }).filter(Boolean);

                    if (totalWorked < goalSeconds) {
                        segments.push(`var(--rem) ${(totalWorked / goalSeconds) * 100}% 100%`);
                    }
                    gradientStr = `conic-gradient(${segments.join(', ')})`;
                }

                grid.innerHTML += `
                    <div class="day-cell">
                        <span class="day-num">${day}</span>
                        <div class="mini-pie" style="background: ${gradientStr};"></div>
                    </div>`;
            }
        }
    }

    function showStats() {
        document.getElementById('mainView').style.display = 'none';
        document.getElementById('statsView').style.display = 'flex';
        document.getElementById('dateSelector').value = new Date().toISOString().split('T')[0];
        changeView('day');
    }

    function hideStats() {
        document.getElementById('mainView').style.display = 'flex';
        document.getElementById('statsView').style.display = 'none';
    }

    // Initialisation
    setPriority(4); 
    updateDisplay();

    // Chargement du thème sauvegardé
    const savedTheme = localStorage.getItem('focusTheme') || 'dark';
    const isLight = savedTheme === 'light';
    document.getElementById('themeToggle').checked = isLight;
    toggleTheme(isLight);
</script>
</body>
</html>
