<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Focus Meter Pro</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='40' fill='none' stroke='%23ffffff' stroke-width='8'/><line x1='50' y1='50' x2='50' y2='30' stroke='%23ffffff' stroke-width='8'/></svg>">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --bg: #121212; --panel: #1e1e1e; --text: #ffffff; --muted: #888; 
                 --p1: #FF4D4D; --p2: #FF9F43; --p3: #F1C40F; --p4: #2ECC71; --rem: #222; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        .app-container { width: 340px; background: var(--panel); border-radius: 16px; padding: 20px; box-sizing: border-box; }
        .timer-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
        #timer { font-size: 32px; font-weight: bold; font-variant-numeric: tabular-nums; }
        .controls-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; margin-bottom: 10px; }
        .p-btn { border: 1px solid #444; background: transparent; color: var(--muted); padding: 8px 0; border-radius: 4px; cursor: pointer; font-size: 11px; }
        .p-btn.active { color: white; border-color: transparent; }
        .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
        button.action { padding: 10px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
        
        /* Stats Styling */
        .stats-view { height: 300px; overflow-y: auto; }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
        .day-cell { height: 35px; background: #333; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 9px; }
        .mini-pie { width: 20px; height: 20px; border-radius: 50%; }
    </style>
</head>
<body>

<div class="app-container">
    <div id="mainView">
        <div class="timer-row">
            <div>
                <div style="font-size: 9px; color: var(--muted);">OBJECTIF <input type="number" id="goalInput" value="7" style="width:25px; background:transparent; border:none; color:white; font-size:9px;" onchange="updateGoal()">H</div>
                <div id="dayTotal">00h00</div>
            </div>
            <div id="timer">00:00:00</div>
        </div>
        <div class="controls-grid" id="priorityGrid">
            <button class="p-btn" onclick="setPriority(1)">P1</button>
            <button class="p-btn" onclick="setPriority(2)">P2</button>
            <button class="p-btn" onclick="setPriority(3)">P3</button>
            <button class="p-btn active" onclick="setPriority(4)">P4</button>
        </div>
        <div class="actions">
            <button id="startStopBtn" class="action" onclick="toggleTimer()" style="background:var(--p4); color:white;">START</button>
            <button class="action" onclick="showStats()" style="background:#333; color:white;">ANALYSE</button>
        </div>
    </div>

    <div id="statsView" style="display:none;">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <h3>Analyse</h3>
            <button onclick="hideStats()" style="background:none; border:none; color:white; cursor:pointer;">✕</button>
        </div>
        <div class="nav-tabs" style="display:flex; gap:5px; margin-bottom:10px;">
            <button class="nav-btn" onclick="renderCharts('day')">Jour</button>
            <button class="nav-btn" onclick="renderCharts('week')">Semaine</button>
            <button class="nav-btn" onclick="renderCharts('month')">Mois</button>
        </div>
        <div id="chartContainer" style="height:200px; display:flex; align-items:center; justify-content:center;">
            <canvas id="myChart"></canvas>
            <div id="monthGrid" class="calendar-grid" style="display:none; width:100%;"></div>
        </div>
    </div>
</div>

<script>
    let timerInterval, startTime, elapsed = 0, isRunning = false, currentPriority = 4, myChart = null;
    let sessions = JSON.parse(localStorage.getItem('focusSessions') || '[]');
    let dailyGoal = parseInt(localStorage.getItem('dailyGoal') || 7) * 3600;

    function updateGoal() { dailyGoal = document.getElementById('goalInput').value * 3600; localStorage.setItem('dailyGoal', document.getElementById('goalInput').value); updateDayStats(); }
    function format(s) { return `${String(Math.floor(s/3600)).padStart(2,'0')}h${String(Math.floor((s%3600)/60)).padStart(2,'0')}`; }

    function setPriority(p) {
        currentPriority = p;
        document.querySelectorAll('.p-btn').forEach((b, i) => {
            b.classList.toggle('active', i+1 === p);
            b.style.backgroundColor = (i+1 === p) ? `var(--p${p})` : 'transparent';
        });
    }

    function toggleTimer() {
        const btn = document.getElementById('startStopBtn');
        if (!isRunning) {
            startTime = Date.now() - elapsed;
            timerInterval = setInterval(updateDisplay, 1000);
            btn.textContent = "STOP"; btn.style.background = "#555"; isRunning = true;
        } else {
            clearInterval(timerInterval); isRunning = false;
            sessions.push({ date: Date.now(), duration: elapsed / 1000, priority: currentPriority });
            localStorage.setItem('focusSessions', JSON.stringify(sessions));
            elapsed = 0; updateDisplay(); btn.textContent = "START"; btn.style.background = `var(--p${currentPriority})`;
        }
    }

    function updateDisplay() {
        if(isRunning) elapsed = Date.now() - startTime;
        document.getElementById('timer').textContent = new Date(elapsed).toISOString().substr(11, 8);
        updateDayStats();
    }

    function updateDayStats() {
        const today = new Date().toDateString();
        const dailySessions = sessions.filter(s => new Date(s.date).toDateString() === today);
        const totalSec = dailySessions.reduce((acc, s) => acc + s.duration, 0) + (isRunning ? elapsed/1000 : 0);
        document.getElementById('dayTotal').textContent = format(totalSec);
    }

    function renderCharts(mode) {
        document.getElementById('chartContainer').innerHTML = mode === 'month' ? '<div id="monthGrid" class="calendar-grid"></div>' : '<canvas id="myChart"></canvas>';
        const ctx = mode !== 'month' ? document.getElementById('myChart').getContext('2d') : null;
        
        if (mode === 'day') {
            const today = new Date().toDateString();
            const daySess = sessions.filter(s => new Date(s.date).toDateString() === today);
            const data = [1,2,3,4].map(p => daySess.filter(s => s.priority === p).reduce((a,s) => a+s.duration, 0));
            const totalWorked = data.reduce((a,b)=>a+b,0);
            data.push(Math.max(0, dailyGoal - totalWorked));
            myChart = new Chart(ctx, { type: 'pie', data: { labels: ['P1','P2','P3','P4','Reste'], datasets: [{ data, backgroundColor: ['var(--p1)','var(--p2)','var(--p3)','var(--p4)','var(--rem)'] }] } });
        } else if (mode === 'week') {
            const last7 = [...Array(7)].map((_, i) => new Date(Date.now() - i * 86400000).toDateString()).reverse();
            const data = last7.map(d => sessions.filter(s => new Date(s.date).toDateString() === d).reduce((a,s) => a+s.duration, 0) / 3600);
            myChart = new Chart(ctx, { type: 'bar', data: { labels: last7.map(d=>d.slice(0,3)), datasets: [{ label: 'Heures', data, backgroundColor: 'var(--p4)' }] } });
        } else {
            const grid = document.getElementById('monthGrid');
            const now = new Date();
            const daysInMonth = new Date(now.getFullYear(), now.getMonth()+1, 0).getDate();
            for(let i=1; i<=daysInMonth; i++) {
                const dStr = new Date(now.getFullYear(), now.getMonth(), i).toDateString();
                const daySess = sessions.filter(s => new Date(s.date).toDateString() === dStr);
                let gradient = "conic-gradient(#333 0% 100%)";
                if(daySess.length > 0) {
                    let acc = 0;
                    const segments = [1,2,3,4].map(p => {
                        const dur = daySess.filter(s=>s.priority===p).reduce((a,s)=>a+s.duration,0);
                        const start = (acc/dailyGoal)*100;
                        acc += dur;
                        const end = (acc/dailyGoal)*100;
                        return `var(--p${p}) ${start}% ${end}%`;
                    }).join(',');
                    gradient = `conic-gradient(${segments}, #222 ${(acc/dailyGoal)*100}% 100%)`;
                }
                grid.innerHTML += `<div class="day-cell"><div class="mini-pie" style="background:${gradient}"></div></div>`;
            }
        }
    }

    function showStats() { document.getElementById('mainView').style.display = 'none'; document.getElementById('statsView').style.display = 'block'; renderCharts('day'); }
    function hideStats() { document.getElementById('mainView').style.display = 'block'; document.getElementById('statsView').style.display = 'none'; }

    setPriority(4); updateDisplay();
</script>
</body>
</html>
