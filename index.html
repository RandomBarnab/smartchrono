<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Focus Meter Pro</title>
    <!-- Favicon intégré -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='40' fill='none' stroke='%23ffffff' stroke-width='8'/><line x1='50' y1='50' x2='50' y2='30' stroke='%23ffffff' stroke-width='8'/></svg>">
    <!-- Chart.js pour les graphiques -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* Variables de Thème (Thème Sombre par défaut) */
        :root { 
            --bg: #121212; 
            --panel: #1e1e1e; 
            --text: #ffffff; 
            --muted: #888888; 
            --p1: #FF4D4D; 
            --p2: #FF9F43; 
            --p3: #F1C40F; 
            --p4: #2ECC71; 
            --rem: #2c2c2c;
            --border: #444444;
            --shadow: 0 12px 36px rgba(0,0,0,0.6);
            --chart-line: #3498db;
            --chart-ideal: #777777;
            --input-bg: #2a2a2a;
        }

        /* Thème Camouflage (Blanc & Gris) */
        body.light-theme {
            --bg: #ffffff;
            --panel: #ffffff;
            --text: #5a5a5a;
            --muted: #aaaaaa;
            --p1: #555555; 
            --p2: #808080; 
            --p3: #b0b0b0; 
            --p4: #dadada; 
            --rem: #f5f5f5; 
            --border: #e5e5e5;
            --shadow: none; 
            --chart-line: #666666;
            --chart-ideal: #cccccc;
            --input-bg: #f9f9f5;
        }

        /* Protection globale contre les débordements */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body { 
            font-family: 'Segoe UI', -apple-system, sans-serif; 
            background: var(--bg); 
            color: var(--text); 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            width: 100vw;
            overflow: hidden; 
            padding: 10px;
            transition: background 0.3s;
        }
        
        /* Conteneur Verrouillé */
        .app-container { 
            width: 100%; 
            max-width: 360px; 
            height: 100%; 
            max-height: 630px;
            background: var(--panel); 
            border-radius: 16px; 
            padding: 16px; 
            display: flex; 
            flex-direction: column;
            justify-content: space-between;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            overflow: hidden;
            position: relative;
        }

        #mainView, #statsView { 
            display: flex; 
            flex-direction: column; 
            justify-content: space-between; 
            height: 100%; 
            width: 100%; 
            gap: 12px;
        }
        #statsView { display: none; }

        /* Timer Section */
        .timer-row { display: flex; align-items: center; justify-content: space-between; width: 100%; }
        #timer { font-size: 34px; font-weight: bold; font-variant-numeric: tabular-nums; line-height: 1; }
        #dayTotal { font-size: 18px; font-weight: bold; }
        #estimatedEnd { font-size: 10px; color: var(--muted); margin-top: 2px; font-style: italic; }
        
        /* Barre d'avancement */
        .progress-wrapper { height: 6px; background: var(--rem); border-radius: 3px; overflow: hidden; display: flex; width: 100%; margin: 6px 0; }
        .segment { height: 100%; transition: width 0.3s; }
        
        /* Boutons de priorité */
        .controls-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; width: 100%; }
        .p-btn { border: 1px solid var(--border); background: transparent; color: var(--text); padding: 6px 0; border-radius: 4px; cursor: pointer; font-size: 10px; transition: all 0.2s; font-weight: bold; }
        .p-btn.active { color: white; border-color: transparent; }
        body.light-theme .p-btn.active { color: #333; }

        .theme-input { width: 30px; background: var(--input-bg); border: 1px solid var(--border); color: var(--text); border-radius: 4px; text-align: center; padding: 2px; font-size: 10px; }

        /* TODO List Section */
        .todo-section { flex: 1; display: flex; flex-direction: column; min-height: 0; border-top: 1px solid var(--border); padding-top: 8px; }
        .todo-header { display: flex; justify-content: space-between; align-items: center; font-size: 11px; font-weight: bold; margin-bottom: 6px; }
        
        /* Conteneur de Saisie Robuste */
        .todo-input-container { display: flex; flex-direction: column; gap: 6px; margin-bottom: 8px; background: rgba(0,0,0,0.05); padding: 6px; border-radius: 6px; border: 1px solid var(--border); width: 100%; }
        .todo-input { width: 100%; background: var(--input-bg); border: 1px solid var(--border); color: var(--text); padding: 5px 8px; border-radius: 4px; font-size: 11px; }
        .todo-list { flex: 1; overflow-y: auto; list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 4px; }
        
        /* Liste des tâches épurée */
        .todo-item { display: flex; align-items: center; justify-content: space-between; background: var(--rem); padding: 6px 8px; border-radius: 6px; border: 1px solid transparent; font-size: 11px; cursor: pointer; transition: background 0.2s; }
        .todo-item.active-task { border-color: var(--chart-line); }
        .todo-item.completed span.todo-text { text-decoration: line-through; color: var(--muted); }
        .todo-item.dragging { opacity: 0.4; border: 1px dashed var(--chart-line); }
        
        /* 2/3 de largeur de ligne pour le titre de tâche (65%) */
        .todo-left { display: flex; align-items: center; gap: 8px; width: 62%; overflow: hidden; }
        .todo-text { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex-grow: 1; text-align: left; }
        .todo-text.expanded { white-space: normal; overflow: visible; text-overflow: clip; word-break: break-word; }
        
        /* Style d'édition en mode Modifier */
        .todo-inline-input { background: transparent; border: none; border-bottom: 1px dashed var(--muted); color: var(--text); font-family: inherit; font-size: 11px; width: 85%; }
        .todo-inline-select { background: var(--rem); border: 1px solid var(--border); color: var(--text); border-radius: 4px; font-size: 9px; padding: 1px; }
        .todo-inline-num { background: var(--input-bg); border: 1px solid var(--border); color: var(--text); text-align: center; border-radius: 4px; font-size: 10px; padding: 1px; width: 34px; }

        .todo-right { display: flex; align-items: center; gap: 4px; width: 38%; justify-content: flex-end; flex-shrink: 0; }

        /* Boutons d'action miniatures */
        .icon-btn { background: none; border: none; color: var(--text); cursor: pointer; padding: 0 2px; font-size: 11px; font-weight: bold; transition: color 0.2s; }
        .icon-btn:hover { color: var(--chart-line); }
        .icon-btn.delete-btn:hover { color: var(--p1); }
        
        /* Grab Handle pour le Drag & Drop */
        .drag-handle { cursor: grab; color: var(--muted); font-size: 14px; padding-right: 2px; user-select: none; }
        .drag-handle:active { cursor: grabbing; }

        /* TIME SPINNER DOUBLE H:MIN */
        .time-picker-row { display: flex; justify-content: space-between; align-items: center; width: 100%; gap: 6px; }
        .spinner-container { display: flex; align-items: center; gap: 4px; background: var(--input-bg); border: 1px solid var(--border); border-radius: 4px; padding: 2px 4px; }
        .spinner-block { display: flex; align-items: center; gap: 1px; }
        .spinner-input { width: 16px; background: transparent; border: none; color: var(--text); font-size: 10px; font-weight: bold; text-align: center; margin: 0; }
        .spinner-input::-webkit-outer-spin-button, .spinner-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        .spinner-arrows { display: flex; flex-direction: column; line-height: 0.4; }
        .spin-btn { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 6px; padding: 1px; line-height: 1; }
        .spin-btn:hover { color: var(--chart-line); }
        .spinner-unit { font-size: 9px; color: var(--muted); font-weight: bold; }

        /* Actions Footer */
        .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; width: 100%; }
        button.action { padding: 10px; border: 1px solid var(--border); border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 12px; color: var(--text); background: var(--panel); }
        #startStopBtn { background: var(--p4); color: var(--bg); border: none; }
        
        /* Interrupteur iOS */
        .switch-container { display: flex; align-items: center; gap: 4px; }
        .switch { position: relative; display: inline-block; width: 24px; height: 14px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #444; transition: .3s; border-radius: 14px; }
        .slider:before { position: absolute; content: ""; height: 10px; width: 11px; left: 2px; bottom: 2px; background-color: white; transition: .3s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--p2); }
        input:checked + .slider:before { transform: translateX(10px); }
        body.light-theme .slider { background-color: #ddd; }

        /* Analyses */
        .nav-tabs { display: flex; gap: 4px; width: 100%; }
        .nav-btn { flex: 1; padding: 5px; font-size: 9px; background: var(--rem); color: var(--text); border: 1px solid var(--border); border-radius: 4px; cursor: pointer; font-weight: bold; }
        .nav-btn.active { background: var(--p4); color: var(--bg); border: none; }
        .stats-scroll { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
        .canvas-wrapper { position: relative; width: 100%; height: 130px; flex-shrink: 0; }
        
        /* Calendrier */
        .calendar-header { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; text-align: center; font-size: 8px; color: var(--muted); margin-bottom: 2px; }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; width: 100%; }
        .day-cell { position: relative; aspect-ratio: 1; background: var(--rem); border-radius: 4px; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 1px 0; box-sizing: border-box; border: 1px solid var(--border); }
        .day-num { font-size: 8px; font-weight: bold; color: var(--text); }
        .mini-pie { width: 12px; height: 12px; border-radius: 50%; background: var(--border); }

        /* Style pour les tâches reportées et déchet mental */
        .todo-item.mental-waste {
            background: linear-gradient(135deg, #2c1a1a 0%, #1e1e1e 100%) !important;
            border: 1px solid #ff4d4d !important;
            position: relative;
            animation: pulse-waste 2s infinite alternate;
        }
        body.light-theme .todo-item.mental-waste {
            background: linear-gradient(135deg, #fff0f0 0%, #ffffff 100%) !important;
            border: 1px solid #ff4d4d !important;
        }
        @keyframes pulse-waste {
            0% { box-shadow: 0 0 2px rgba(255,77,77,0.2); }
            100% { box-shadow: 0 0 8px rgba(255,77,77,0.4); }
        }
        .waste-banner {
            font-size: 8px;
            color: #ff4d4d;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 2px;
            display: flex;
            align-items: center;
            gap: 3px;
        }
        .waste-actions {
            display: flex;
            gap: 4px;
            margin-top: 4px;
        }
        .waste-action-btn {
            font-size: 8px;
            padding: 2px 6px;
            border-radius: 4px;
            cursor: pointer;
            border: 1px solid var(--border);
            background: var(--rem);
            color: var(--text);
            font-weight: bold;
        }
        .waste-action-btn:hover {
            background: var(--border);
        }
        .discrete-footer {
            position: absolute;
            bottom: 4px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 8px;
            color: var(--muted);
            opacity: 0.3;
            cursor: pointer;
            transition: opacity 0.2s;
            z-index: 100;
            white-space: nowrap;
            user-select: none;
        }
        .discrete-footer:hover {
            opacity: 0.8;
        }
    </style>
</head>
<body>

<div class="app-container">
    <!-- VUE PRINCIPALE -->
    <div id="mainView">
        <div class="timer-row">
            <div>
                <div style="font-size: 10px; color: var(--muted); display: flex; align-items: center; gap: 4px;">
                    OBJ : <input type="number" id="goalInput" min="1" max="24" value="7" class="theme-input" onchange="updateGoal(this.value)">H
                </div>
                <div style="display: flex; align-items: baseline; gap: 6px; margin-top: 2px;">
                    <span id="dayTotal">00:00:00</span>
                    <span id="percText" style="font-size: 11px; color: var(--muted); font-weight: bold;">(0%)</span>
                </div>
                <div id="estimatedEnd">Fin estimée : --:--</div>
                
                <!-- Ligne de Ratio Prévu / Réel centralisée en haut -->
                <div style="display: flex; align-items: center; gap: 6px; margin-top: 2px; font-size: 10px; color: var(--muted);">
                    <div>Ratio : <input type="number" id="ratioInput" min="50" max="100" value="90" class="theme-input" style="width:34px;" onchange="updateRatio(this.value)">%</div>
                    <span style="color: var(--border);">|</span>
                    <div id="realConcentrationRate" style="font-weight: bold;">Ratio réel : --%</div>
                </div>
            </div>
            <div style="display: flex; flex-direction: column; align-items: flex-end;">
                <div id="timer">00:00:00</div>
                <div class="switch-container">
                    <span style="font-size: 8px; color: var(--muted);">Discret</span>
                    <label class="switch"><input type="checkbox" id="themeToggle" onchange="toggleTheme(this.checked)"><span class="slider"></span></label>
                </div>
            </div>
        </div>

        <div class="progress-wrapper" id="progressBar"></div>

        <div class="controls-grid" id="priorityGrid">
            <button class="p-btn" onclick="setPriority(1)">P1</button>
            <button class="p-btn" onclick="setPriority(2)">P2</button>
            <button class="p-btn" onclick="setPriority(3)">P3</button>
            <button class="p-btn active" onclick="setPriority(4)">P4</button>
        </div>

        <!-- TO-DO LIST -->
        <div class="todo-section">
            <div class="todo-header" style="font-size:10px;">
                <div style="display:flex; gap: 6px; align-items:center;">
                    <span style="font-weight:bold; font-size:11px;">Ma To-Do</span>
                    <span id="toggleCompletedBtn" onclick="toggleCompletedVisibility()" style="cursor:pointer; text-decoration:underline; color:var(--muted);">Afficher terminées</span>
                    <span id="toggleEditBtn" onclick="toggleEditMode()" style="cursor:pointer; text-decoration:underline; color:var(--muted); font-weight: bold;">Modifier</span>
                </div>
                <!-- Warning "Charge" déplacé élégamment à gauche de "Est: 0h" -->
                <div style="display: flex; align-items: center; gap: 4px;">
                    <span id="loadIndicator"></span>
                    <span id="todoTotalTime" style="font-weight: normal; color: var(--muted);">Est: 0h</span>
                </div>
            </div>
            
            <div class="todo-input-container">
                <input type="text" id="todoTextInput" placeholder="Nouvelle tâche..." class="todo-input" onkeypress="handleTodoKeyPress(event)">
                <div class="time-picker-row">
                    <div style="display:flex; align-items:center; gap:4px;">
                        <span style="font-size:9px; color:var(--muted);">Prio :</span>
                        <select id="todoPriorityInput" class="theme-input" style="width: 40px; font-size:9px;">
                            <option value="1">P1</option><option value="2">P2</option><option value="3">P3</option><option value="4" selected>P4</option>
                        </select>
                    </div>
                    
                    <!-- TIME SPINNER DOUBLE H:MIN -->
                    <div style="display:flex; align-items:center; gap:4px;">
                        <span style="font-size:9px; color:var(--muted);">Est. :</span>
                        <div class="spinner-container">
                            <!-- Heures -->
                            <div class="spinner-block">
                                <input type="number" id="newHoursInput" value="1" min="0" max="23" class="spinner-input" onchange="validateSpinnerInput()">
                                <div class="spinner-arrows">
                                    <button onclick="adjustNewHours(1)" class="spin-btn">▲</button>
                                    <button onclick="adjustNewHours(-1)" class="spin-btn">▼</button>
                                </div>
                                <span class="spinner-unit">h</span>
                            </div>
                            <!-- Minutes -->
                            <div class="spinner-block" style="margin-left:2px;">
                                <input type="number" id="newMinsInput" value="0" min="0" max="45" step="15" class="spinner-input" onchange="validateSpinnerInput()">
                                <div class="spinner-arrows">
                                    <button onclick="adjustNewMins(15)" class="spin-btn">▲</button>
                                    <button onclick="adjustNewMins(-15)" class="spin-btn">▼</button>
                                </div>
                                <span class="spinner-unit">m</span>
                            </div>
                        </div>
                    </div>
                    
                    <button onclick="addTodo()" class="action" style="padding:2px 8px; font-size:10px; width:auto;">+</button>
                </div>
            </div>
            <ul class="todo-list" id="todoList"></ul>
        </div>

        <div class="actions">
            <button id="startStopBtn" class="action" onclick="toggleTimer()">START</button>
            <button class="action" onclick="showStats()">ANALYSE</button>
        </div>
    </div>

        <!-- VUE ANALYSE -->
    <div id="statsView">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 5px;">
            <h3 style="margin:0; font-size:14px;">Analyse</h3>
            <button onclick="hideStats()" style="background:none; border:none; color:var(--text); cursor:pointer; font-size:14px;">✕</button>
        </div>

        <!-- Toggle d'analyse (Focus vs Tâches) -->
        <div style="display: flex; gap: 4px; margin-bottom: 4px;">
            <button id="analysis-focus-btn" class="nav-btn active" onclick="setAnalysisTab('focus')" style="flex: 1; font-size: 10px; padding: 6px;">⏱️ Focus</button>
            <button id="analysis-tasks-btn" class="nav-btn" onclick="setAnalysisTab('tasks')" style="flex: 1; font-size: 10px; padding: 6px;">📋 Tâches</button>
        </div>

        <!-- Section de Focus (existante) -->
        <div id="focusAnalysisSection" style="display: flex; flex-direction: column; flex: 1; min-height: 0; gap: 6px;">
            <div class="nav-tabs">
                <button id="tab-day" class="nav-btn active" onclick="changeView('day')">Jour</button>
                <button id="tab-week" class="nav-btn" onclick="changeView('week')">Semaine</button>
                <button id="tab-month" class="nav-btn" onclick="changeView('month')">Mois</button>
            </div>
            
            <div style="display: flex; gap: 6px; align-items: center; margin-bottom: 4px; flex-shrink: 0;">
                <input type="date" id="dateSelector" onchange="renderCharts()" style="flex: 1; background:var(--rem); color:var(--text); border:1px solid var(--border); padding:4px; border-radius:4px; font-size:10px; font-family: inherit;">
                <div id="startHourContainer" style="font-size:9px; color:var(--muted); white-space:nowrap;">
                    Début : <input type="number" id="startHourInput" min="0" max="23" value="9" class="theme-input" style="width:24px;" onchange="updateStartHour(this.value)">H
                </div>
            </div>
            
            <div class="stats-scroll">
                <div class="canvas-wrapper" id="pieWrapper"><canvas id="myChart"></canvas></div>
                <div class="canvas-wrapper" id="sCurveWrapper"><canvas id="sCurveChart"></canvas></div>
                <div id="calendarContainer" style="display:none; width: 100%;">
                    <div class="calendar-header"><span>Lu</span><span>Ma</span><span>Me</span><span>Je</span><span>Ve</span><span>Sa</span><span>Di</span></div>
                    <div id="monthGrid" class="calendar-grid"></div>
                </div>
                <div id="sessionsListContainer"></div>
            </div>
        </div>

        <!-- Section de Tâches (nouvelle) -->
        <div id="tasksAnalysisSection" style="display: none; flex-direction: column; flex: 1; min-height: 0; gap: 6px;">
            <div class="nav-tabs" style="margin-bottom: 4px;">
                <button id="task-tab-stats" class="nav-btn active" onclick="changeTaskView('stats')">Graphiques</button>
                <button id="task-tab-history" class="nav-btn" onclick="changeTaskView('history')">Historique</button>
                <button id="task-tab-postponed" class="nav-btn" onclick="changeTaskView('postponed')">Reportées</button>
            </div>
            
            <div class="stats-scroll" id="tasksScrollContainer" style="display: flex; flex-direction: column; gap: 8px;">
                <!-- Les graphiques ou listes seront injectés ici de manière dynamique -->
            </div>
        </div>
    </div>
    
    <!-- Footer discret pour l'import / export -->
    <div class="discrete-footer">
        <span onclick="exportData()">Exporter données</span> | <span onclick="importData()">Importer données</span>
    </div>
</div>
</div>

<script>
    let timerInterval, startTime, elapsed = 0, isRunning = false, currentPriority = 4;
    let currentView = 'day', myChart = null, sCurveChart = null;
    let isStartHourManuallySet = false;
    let showCompletedTodos = localStorage.getItem('focusShowCompletedTodos') === 'true';
    let editModeActive = false;
    
    // --- BOUCLIER DE SÉCURITÉ LOCALSTORAGE (Anti-crash absolu) ---
    let sessions = [];
    try {
        const rawSess = localStorage.getItem('focusSessions');
        sessions = rawSess ? JSON.parse(rawSess) : [];
        if (!Array.isArray(sessions)) sessions = [];
    } catch(e) { sessions = []; }

    let dailyGoalHours = parseInt(localStorage.getItem('focusDailyGoal') || '7');
    let dayStartHour = parseInt(localStorage.getItem('focusStartHour') || '9');
    let concentrationRatio = parseInt(localStorage.getItem('focusRatio') || '90') / 100;
    
    let todos = [];
    try {
        const rawTodos = localStorage.getItem('focusTodos');
        todos = rawTodos ? JSON.parse(rawTodos) : [];
        if (!Array.isArray(todos)) todos = [];
    } catch(e) { todos = []; }

    // Nettoyage et calibration du LocalStorage
    todos = todos.map(t => {
        if (!t || typeof t !== 'object') return null;
        return {
            id: t.id ? String(t.id) : Date.now().toString() + Math.random(),
            text: t.text ? String(t.text) : "Sans titre",
            priority: parseInt(t.priority) || 4,
            estimate: parseFloat(t.estimate) || 1.0,
            worked: parseFloat(t.worked) || 0,
            completed: !!t.completed,
            postponeCount: parseInt(t.postponeCount) || 0,
            postponedUntil: t.postponedUntil || null
        };
    }).filter(Boolean);

    let activeTodoId = localStorage.getItem('focusActiveTodoId');
    if (activeTodoId === "null" || activeTodoId === "undefined" || !activeTodoId) {
        activeTodoId = null;
    }

    document.getElementById('goalInput').value = dailyGoalHours;
    document.getElementById('startHourInput').value = dayStartHour;
    document.getElementById('ratioInput').value = Math.round(concentrationRatio * 100);

    function parseSessionDate(dateInput) {
        if (!dateInput) return null;
        if (typeof dateInput === 'string' && /^\d+$/.test(dateInput)) dateInput = parseInt(dateInput);
        const d = new Date(dateInput);
        return isNaN(d.getTime()) ? null : d;
    }

    function getLocalYYYYMMDD(dateObj) {
        const d = dateObj || new Date();
        const yyyy = d.getFullYear();
        const mm = String(d.getMonth() + 1).padStart(2, '0');
        const dd = String(d.getDate()).padStart(2, '0');
        return `${yyyy}-${mm}-${dd}`;
    }

    function getThemeColor(v) { return getComputedStyle(document.body).getPropertyValue(v).trim(); }

    function toggleTheme(isLight) {
        document.body.classList.toggle('light-theme', isLight);
        localStorage.setItem('focusTheme', isLight ? 'light' : 'dark');
        updateDayStats();
        setPriority(currentPriority);
        if (document.getElementById('statsView').style.display === 'flex') renderCharts();
    }

    function updateGoal(val) {
        dailyGoalHours = Math.max(1, Math.min(24, parseInt(val) || 7));
        localStorage.setItem('focusDailyGoal', dailyGoalHours);
        updateDayStats();
    }

    function updateRatio(val) {
        let r = Math.max(50, Math.min(100, parseInt(val) || 90));
        concentrationRatio = r / 100;
        localStorage.setItem('focusRatio', r);
        updateDayStats();
    }

    function updateStartHour(val) {
        dayStartHour = Math.max(0, Math.min(23, parseInt(val) || 9));
        localStorage.setItem('focusStartHour', dayStartHour);
        isStartHourManuallySet = true;
        if (currentView === 'day') renderCharts();
    }

    function getAutoStartHour(selectedDateStr) {
        let startTimestamps = [];
        const daySess = sessions.filter(s => {
            if (!s || !s.date) return false;
            const d = parseSessionDate(s.date);
            return d && getLocalYYYYMMDD(d) === selectedDateStr;
        });
        
        daySess.forEach(s => {
            const parsedDate = parseSessionDate(s.date);
            if (parsedDate) {
                startTimestamps.push(parsedDate.getTime() - (parseFloat(s.duration) || 0) * 1000);
            }
        });
        
        const todayStr = getLocalYYYYMMDD();
        if (isRunning && selectedDateStr === todayStr) startTimestamps.push(startTime);
        
        if (startTimestamps.length > 0) {
            const minTimestamp = Math.min(...startTimestamps);
            const minDate = new Date(minTimestamp);
            return Math.floor(minDate.getHours() * 2 + minDate.getMinutes() / 30) / 2;
        }
        return parseInt(localStorage.getItem('focusStartHour') || '9');
    }

    function formatTaskWorked(sec) {
        if (!sec || sec < 0) return "0m";
        const h = Math.floor(sec / 3600);
        const m = Math.floor((sec % 3600) / 60);
        const s = Math.floor(sec % 60);
        if (h > 0) return `${h}h${String(m).padStart(2, '0')}`;
        if (m > 0) return `${m}m`;
        return `${s}s`;
    }

    function formatHoursMinutes(decimalHours) {
        const totalMinutes = Math.round(decimalHours * 60);
        const h = Math.floor(totalMinutes / 60);
        const m = totalMinutes % 60;
        return `${h}h${String(m).padStart(2, '0')}`;
    }

    // --- CONTROLES DU TIME SPINNER (H:MIN) ---
    function adjustNewHours(delta) {
        const hInput = document.getElementById('newHoursInput');
        let val = parseInt(hInput.value) || 0;
        val = Math.max(0, Math.min(23, val + delta));
        hInput.value = val;
    }

    function adjustNewMins(delta) {
        const mInput = document.getElementById('newMinsInput');
        let val = parseInt(mInput.value) || 0;
        val = val + delta;
        if (val < 0) val = 45;
        if (val > 45) val = 0;
        mInput.value = val;
    }

    function validateSpinnerInput() {
        const hInput = document.getElementById('newHoursInput');
        const mInput = document.getElementById('newMinsInput');
        let h = parseInt(hInput.value) || 0;
        let m = parseInt(mInput.value) || 0;
        hInput.value = Math.max(0, Math.min(23, h));
        mInput.value = Math.max(0, Math.min(59, m));
    }

    // --- TO-DO LIST ENGINE ---
    function renderTodos() {
        const list = document.getElementById('todoList');
        list.innerHTML = '';
        let estSum = 0;
        const todayStr = getLocalYYYYMMDD();

        todos.forEach(t => {
            if (!t) return;
            
            // Masquer les tâches reportées au lendemain (sauf si terminées ou si la date de report est passée/aujourd'hui)
            if (!t.completed && t.postponedUntil && t.postponedUntil > todayStr) {
                return;
            }

            if (!t.completed) estSum += t.estimate;
            if (t.completed && !showCompletedTodos) return;

            const li = document.createElement('li');
            li.className = `todo-item ${t.completed ? 'completed' : ''} ${t.id == activeTodoId ? 'active-task' : ''}`;
            li.dataset.id = t.id;

            // DRAG & DROP HTML5
            if (editModeActive) {
                li.draggable = true;
                li.addEventListener('dragstart', (e) => {
                    e.dataTransfer.setData('text/plain', t.id);
                    li.classList.add('dragging');
                });
                li.addEventListener('dragover', (e) => {
                    e.preventDefault();
                    const draggingEl = document.querySelector('.dragging');
                    if (draggingEl && draggingEl !== li) {
                        const rect = li.getBoundingClientRect();
                        const next = (e.clientY - rect.top) / (rect.bottom - rect.top) > 0.5;
                        list.insertBefore(draggingEl, next ? li.nextSibling : li);
                    }
                });
                li.addEventListener('drop', (e) => {
                    e.preventDefault();
                    const newOrderIds = Array.from(list.children).map(child => child.dataset.id);
                    todos = newOrderIds.map(id => todos.find(todo => todo.id === id)).filter(Boolean);
                    localStorage.setItem('focusTodos', JSON.stringify(todos));
                });
                li.addEventListener('dragend', () => {
                    li.classList.remove('dragging');
                    renderTodos();
                });
            } else {
                li.onclick = (e) => {
                    if (e.target.type === 'checkbox') return;
                    selectTodo(t.id);
                };
            }

            let displaySec = parseFloat(t.worked) || 0;
            let liveTimerHtml = '';
            
            if (t.id == activeTodoId) {
                liveTimerHtml = `<span id="live-task-time-span" style="font-weight:bold; color:var(--chart-line);">⏱️ ${formatTaskWorked(displaySec + (isRunning ? elapsed / 1000 : 0))}</span>`;
            } else {
                liveTimerHtml = `<span class="todo-time-display">⏱️ ${formatTaskWorked(displaySec)}</span>`;
            }

            let leftBlock = '';
            let rightBlock = '';

            if (editModeActive) {
                // MODIFICATION 100% INLINE SANS BOITE DE DIALOGUE (✏️ a disparu)
                leftBlock = `
                    <span class="drag-handle">⋮</span>
                    <input type="text" class="todo-inline-input" value="${t.text}" onchange="updateTodoTextInline('${t.id}', this.value)">
                `;
                rightBlock = `
                    <!-- Menu déroulant discret de priorité -->
                    <select class="todo-inline-select" onchange="updateTodoPriorityInline('${t.id}', this.value)">
                        <option value="1" ${t.priority === 1 ? 'selected' : ''}>P1</option>
                        <option value="2" ${t.priority === 2 ? 'selected' : ''}>P2</option>
                        <option value="3" ${t.priority === 3 ? 'selected' : ''}>P3</option>
                        <option value="4" ${t.priority === 4 ? 'selected' : ''}>P4</option>
                    </select>
                    
                    <!-- Saisie en ligne du temps réalisé (Chrono) en minutes -->
                    <span style="font-size:10px; color:var(--muted); display:flex; align-items:center; gap:1px;">
                        ⏱️<input type="number" class="todo-inline-num" value="${Math.round(displaySec/60)}" onchange="updateTodoWorkedInline('${t.id}', this.value)">m
                    </span>
                    
                    <!-- Saisie en ligne du temps estimé en heures -->
                    <input type="number" class="todo-inline-num" value="${t.estimate.toFixed(2)}" step="0.25" min="0.25" onchange="updateTodoEstimateInline('${t.id}', this.value)">h
                    
                    <button class="icon-btn delete-btn" onclick="event.stopPropagation(); deleteTodo('${t.id}')">✕</button>
                `;
            } else {
                let wasteIndicator = '';
                let wasteActionsHtml = '';
                if (t.postponeCount >= 3) {
                    li.classList.add('mental-waste');
                    wasteIndicator = `<div class="waste-banner">🗑️ DÉCHET MENTAL (Reporté ${t.postponeCount}x) : À agir d'urgence !</div>`;
                    wasteActionsHtml = `
                        <div class="waste-actions" onclick="event.stopPropagation();">
                            <button class="waste-action-btn" onclick="splitTodo('${t.id}')" title="Subdiviser en plusieurs tâches">✂️ Diviser</button>
                            <button class="waste-action-btn" onclick="delegateTodo('${t.id}')" title="Modifier ou déléguer">✏️ Modif/Déléguer</button>
                            <button class="waste-action-btn" onclick="deleteTodo('${t.id}')" title="Jeter la tâche définitivement">🗑️ Jeter</button>
                        </div>
                    `;
                }

                leftBlock = `
                    <input type="checkbox" ${t.completed ? 'checked' : ''} onclick="event.stopPropagation(); toggleTodoDone('${t.id}')">
                    <div style="display: flex; flex-direction: column; flex-grow: 1; overflow: hidden; text-align: left;">
                        <span class="todo-text" onclick="toggleExpandText(this, event)" style="${t.postponeCount >= 3 ? 'color:#ff4d4d; font-weight:bold;' : ''}">
                            ${t.postponeCount >= 3 ? '⚠️ ' : ''}${t.text}
                        </span>
                        ${wasteIndicator}
                        ${wasteActionsHtml}
                    </div>
                `;
                rightBlock = `
                    <span class="session-priority" style="background:var(--p${t.priority})">P${t.priority}</span>
                    <div style="display: flex; flex-direction: column; align-items: flex-end;">
                        <span style="font-size:10px; color:var(--muted); font-weight:bold; font-variant-numeric: tabular-nums; white-space:nowrap;">
                            ${liveTimerHtml} / ${formatHoursMinutes(t.estimate)}
                        </span>
                        <div style="display: flex; gap: 4px; margin-top: 2px;">
                            <button class="icon-btn postpone-btn" onclick="event.stopPropagation(); postponeTodo('${t.id}')" title="Reporter au lendemain" style="font-size: 10px;">⏭️</button>
                        </div>
                    </div>
                `;
            }

            li.innerHTML = `
                <div class="todo-left">${leftBlock}</div>
                <div class="todo-right">${rightBlock}</div>
            `;
            list.appendChild(li);
        });

        document.getElementById('todoTotalTime').textContent = `Est: ${estSum.toFixed(1)}h`;
        
        // Affichage de l'avertissement de charge juste à gauche de l'estimation horaire
        const loadEl = document.getElementById('loadIndicator');
        if (estSum > dailyGoalHours * 0.9) {
            loadEl.innerHTML = `<span style="color:var(--p2); font-weight:bold; margin-right: 4px; font-size: 10px;">⚠️ Charge (${Math.round(estSum/dailyGoalHours*100)}%)</span>`;
        } else {
            loadEl.innerHTML = '';
        }
    }

    function toggleExpandText(element, event) {
        event.stopPropagation();
        element.classList.toggle('expanded');
    }

    function toggleCompletedVisibility() {
        showCompletedTodos = !showCompletedTodos;
        localStorage.setItem('focusShowCompletedTodos', showCompletedTodos);
        document.getElementById('toggleCompletedBtn').textContent = showCompletedTodos ? "Masquer terminées" : "Afficher terminées";
        renderTodos();
    }

    function toggleEditMode() {
        editModeActive = !editModeActive;
        document.body.classList.toggle('edit-mode-active', editModeActive);
        const btn = document.getElementById('toggleEditBtn');
        btn.textContent = editModeActive ? "Quitter" : "Modifier";
        btn.style.color = editModeActive ? "var(--p2)" : "var(--muted)";
        renderTodos();
    }

    // --- FONCTIONS DE MISE À JOUR EN LIGNE (100% crash-free) ---
    function updateTodoTextInline(id, val) {
        const t = todos.find(t => t.id === id);
        if (t && val.trim() !== "") {
            t.text = val.trim();
            localStorage.setItem('focusTodos', JSON.stringify(todos));
        }
    }

    function updateTodoPriorityInline(id, val) {
        const t = todos.find(t => t.id === id);
        if (t) {
            t.priority = parseInt(val) || 4;
            localStorage.setItem('focusTodos', JSON.stringify(todos));
            renderTodos();
        }
    }

    function updateTodoWorkedInline(id, val) {
        const t = todos.find(t => t.id === id);
        if (t) {
            let m = parseFloat(val) || 0;
            t.worked = m * 60;
            localStorage.setItem('focusTodos', JSON.stringify(todos));
            updateDayStats();
        }
    }

    function updateTodoEstimateInline(id, val) {
        const t = todos.find(t => t.id === id);
        if (t) {
            let h = parseFloat(val) || 1.0;
            t.estimate = Math.max(0.25, h);
            localStorage.setItem('focusTodos', JSON.stringify(todos));
            updateDayStats();
        }
    }

    function handleTodoKeyPress(e) {
        if (e.key === 'Enter') {
            addTodo();
        }
    }

    function addTodo() {
        const txt = document.getElementById('todoTextInput').value.trim();
        const p = parseInt(document.getElementById('todoPriorityInput').value);
        if (!txt) return;

        const h = parseInt(document.getElementById('newHoursInput').value) || 0;
        const m = parseInt(document.getElementById('newMinsInput').value) || 0;
        const estDecimal = (h * 60 + m) / 60;

        todos.push({ id: Date.now().toString(), text: txt, priority: p, estimate: Math.max(0.25, estDecimal), worked: 0, completed: false });
        localStorage.setItem('focusTodos', JSON.stringify(todos));
        document.getElementById('todoTextInput').value = '';
        renderTodos();
    }

    function toggleTodoDone(id) {
        const t = todos.find(t => t.id === id);
        if (t) {
            t.completed = !t.completed;
            if (t.completed && activeTodoId === id) activeTodoId = null;
            localStorage.setItem('focusTodos', JSON.stringify(todos));
            localStorage.setItem('focusActiveTodoId', activeTodoId);
            renderTodos();
        }
    }

    function deleteTodo(id) {
        todos = todos.filter(t => t.id !== id);
        if (activeTodoId === id) activeTodoId = null;
        localStorage.setItem('focusTodos', JSON.stringify(todos));
        localStorage.setItem('focusActiveTodoId', activeTodoId);
        renderTodos();
    }

    function selectTodo(id) {
        const t = todos.find(t => t.id === id);
        if (t && !t.completed) {
            activeTodoId = (activeTodoId === id) ? null : id;
            localStorage.setItem('focusActiveTodoId', activeTodoId);
            if (activeTodoId) setPriority(t.priority);
            renderTodos();
        }
    }

    // Fonction setPriority corrigée et 100% crash-free (activePriorityLabel supprimé)
    function setPriority(p) {
        currentPriority = p;
        document.querySelectorAll('.p-btn').forEach((b, i) => {
            const isActive = (i+1 === p);
            b.classList.toggle('active', isActive);
            b.style.backgroundColor = isActive ? `var(--p${p})` : 'transparent';
            if (isActive) {
                b.style.color = (p === 4 && document.body.classList.contains('light-theme')) ? '#333333' : '#ffffff';
            } else {
                b.style.color = document.body.classList.contains('light-theme') ? '#5a5a5a' : 'var(--muted)';
            }
        });
    }

    // --- TIMER ENGINE ---
    function toggleTimer() {
        const btn = document.getElementById('startStopBtn');
        if (!isRunning) {
            startTime = Date.now() - elapsed;
            timerInterval = setInterval(updateDisplay, 1000);
            btn.textContent = "STOP"; btn.style.background = "#555"; isRunning = true;
        } else {
            clearInterval(timerInterval); isRunning = false;
            let durationSec = elapsed / 1000;
            sessions.push({ date: Date.now(), duration: durationSec, priority: currentPriority, todoId: activeTodoId || null });
            localStorage.setItem('focusSessions', JSON.stringify(sessions));
            
            if (activeTodoId) {
                const t = todos.find(t => t.id === activeTodoId);
                if (t) t.worked = (parseFloat(t.worked) || 0) + durationSec;
                localStorage.setItem('focusTodos', JSON.stringify(todos));
            }
            
            elapsed = 0; updateDisplay(); btn.textContent = "START"; btn.style.background = `var(--p${currentPriority})`;
            renderTodos();
        }
    }

    function updateDisplay() {
        if(isRunning) elapsed = Date.now() - startTime;
        const h = Math.floor(elapsed / 3600000), m = Math.floor((elapsed % 3600000) / 60000), s = Math.floor((elapsed % 60000) / 1000);
        document.getElementById('timer').textContent = `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
        updateDayStats();
        
        if (isRunning) {
            const liveSpan = document.getElementById('live-task-time-span');
            if (liveSpan && activeTodoId) {
                const activeTodo = todos.find(t => t.id == activeTodoId);
                if (activeTodo) {
                    const totalSec = (parseFloat(activeTodo.worked) || 0) + (elapsed / 1000);
                    liveSpan.textContent = `⏱️ ${formatTaskWorked(totalSec)}`;
                }
            }
            if (document.getElementById('statsView').style.display === 'flex' && currentView === 'day') renderCharts();
        }
    }

    function updateDayStats() {
        try {
            const today = new Date().toDateString();
            const dailySessions = sessions.filter(s => s && s.date && new Date(s.date).toDateString() === today);
            const totalSec = dailySessions.reduce((acc, s) => acc + (parseFloat(s.duration) || 0), 0) + (isRunning ? elapsed/1000 : 0);
            
            const h = Math.floor(totalSec / 3600), m = Math.floor((totalSec % 3600) / 60), s = Math.floor(totalSec % 60);
            document.getElementById('dayTotal').textContent = `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
            
            const goalSeconds = dailyGoalHours * 3600;
            const percentVal = Math.min((totalSec / goalSeconds) * 100, 100).toFixed(1);
            document.getElementById('percText').textContent = `(${percentVal}%)`;
            
            const remainingSec = Math.max(0, goalSeconds - totalSec);
            const estEndEl = document.getElementById('estimatedEnd');
            
            if (remainingSec <= 0) {
                estEndEl.textContent = "Objectif atteint !";
            } else {
                const now = new Date();
                const realRemainingSec = remainingSec / concentrationRatio;
                let estimatedEndTime = new Date(now.getTime() + realRemainingSec * 1000);
                
                const lunchLimit = new Date(now);
                lunchLimit.setHours(12, 30, 0, 0);
                if (now < lunchLimit && estimatedEndTime > lunchLimit) {
                    estimatedEndTime = new Date(estimatedEndTime.getTime() + 3600 * 1000);
                }
                
                estEndEl.textContent = `Fin estimée : ${estimatedEndTime.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}`;
            }

            updateRealConcentrationRate(totalSec);

            const bar = document.getElementById('progressBar');
            bar.innerHTML = '';
            [1,2,3,4].forEach(p => {
                const pSec = dailySessions.filter(s => s && parseInt(s.priority) === p).reduce((a,s) => a + (parseFloat(s.duration) || 0), 0);
                if (pSec > 0) {
                    const seg = document.createElement('div'); seg.className = 'segment'; 
                    seg.style.width = (pSec / goalSeconds * 100) + '%'; 
                    seg.style.backgroundColor = `var(--p${p})`; bar.appendChild(seg);
                }
            });
        } catch (e) {
            console.error(e);
        }
    }

    function updateRealConcentrationRate(totalWorkedSec) {
        const rateEl = document.getElementById('realConcentrationRate');
        if (!rateEl) return;

        try {
            const todayStr = getLocalYYYYMMDD();
            let startTimestamps = [];
            const daySess = sessions.filter(s => {
                if (!s || !s.date) return false;
                const d = parseSessionDate(s.date);
                return d && getLocalYYYYMMDD(d) === todayStr;
            });
            
            daySess.forEach(s => {
                const parsedDate = parseSessionDate(s.date);
                if (parsedDate) startTimestamps.push(parsedDate.getTime() - (parseFloat(s.duration) || 0) * 1000);
            });
            
            if (isRunning) startTimestamps.push(startTime);

            if (startTimestamps.length === 0) {
                rateEl.textContent = "Ratio réel : --%";
                return;
            }

            const firstStart = Math.min(...startTimestamps);
            const now = Date.now();
            const elapsedTotalMs = now - firstStart;

            if (elapsedTotalMs <= 0) {
                rateEl.textContent = "Ratio réel : 100%";
                return;
            }

            const todayLunchStart = new Date(); todayLunchStart.setHours(12, 30, 0, 0);
            const todayLunchEnd = new Date(); todayLunchEnd.setHours(13, 30, 0, 0);

            const overlapStart = Math.max(firstStart, todayLunchStart.getTime());
            const overlapEnd = Math.min(now, todayLunchEnd.getTime());
            const lunchOverlapMs = Math.max(0, overlapEnd - overlapStart);

            let netElapsedSec = (elapsedTotalMs - lunchOverlapMs) / 1000;
            if (netElapsedSec <= 0) netElapsedSec = 1;

            const rate = (totalWorkedSec / netElapsedSec) * 100;
            rateEl.textContent = `Ratio réel : ${Math.min(100, Math.max(0, rate)).toFixed(1)}%`;
        } catch (e) {
            rateEl.textContent = "Ratio réel : --%";
        }
    }

    function deleteSession(sessionDateStr) {
        if (confirm("Voulez-vous supprimer cette session de l'historique ?")) {
            sessions = sessions.filter(s => {
                if (!s || !s.date) return false;
                return s.date !== sessionDateStr && String(s.date) !== String(sessionDateStr);
            });
            localStorage.setItem('focusSessions', JSON.stringify(sessions));
            updateDayStats();
            renderCharts();
        }
    }

    function editSession(sessionDateStr) {
        const s = sessions.find(s => s && (s.date === sessionDateStr || String(s.date) === String(sessionDateStr)));
        if (!s) return;

        let currentMinutes = (parseFloat(s.duration) || 0) / 60;
        let newMin = prompt("Modifier la durée de cette session (en minutes) :", currentMinutes.toFixed(1));
        if (newMin === null) return;

        let parsedMin = parseFloat(newMin);
        if (isNaN(parsedMin) || parsedMin < 0) {
            alert("Durée invalide.");
            return;
        }

        let newPrio = prompt("Modifier la priorité (1, 2, 3 ou 4) :", s.priority);
        if (newPrio === null) return;

        let parsedPrio = parseInt(newPrio);
        if (isNaN(parsedPrio) || parsedPrio < 1 || parsedPrio > 4) {
            alert("Priorité invalide (doit être entre 1 et 4).");
            return;
        }

        s.duration = parsedMin * 60;
        s.priority = parsedPrio;
        localStorage.setItem('focusSessions', JSON.stringify(sessions));
        updateDayStats();
        renderCharts();
    }

    // --- ANALYSE & CHARTS ENGINE ---
    function changeView(view) {
        currentView = view;
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.toggle('active', b.id === `tab-${view}`));
        document.getElementById('startHourContainer').style.display = (view === 'day') ? 'block' : 'none';
        isStartHourManuallySet = false;
        renderCharts();
    }

    function getTheoreticalFocusAt(t) {
        if (t <= dayStartHour) return 0;
        let activeWorkTime = 0;
        let lunchStart = 12.5; let lunchEnd = 13.5;
        let hasLunch = (dayStartHour < lunchStart);

        if (hasLunch) {
            if (t <= lunchStart) activeWorkTime = t - dayStartHour;
            else if (t <= lunchEnd) activeWorkTime = lunchStart - dayStartHour;
            else activeWorkTime = (t - dayStartHour) - 1.0;
        } else {
            activeWorkTime = t - dayStartHour;
        }
        return Math.max(0, Math.min(dailyGoalHours, activeWorkTime * concentrationRatio));
    }

    function renderCharts() {
        if (myChart) myChart.destroy();
        if (sCurveChart) sCurveChart.destroy();
        
        const ctx = document.getElementById('myChart').getContext('2d');
        const sCtx = document.getElementById('sCurveChart').getContext('2d');
        const listContainer = document.getElementById('sessionsListContainer');
        const calContainer = document.getElementById('calendarContainer');
        const pieWrapper = document.getElementById('pieWrapper');
        const sCurveWrapper = document.getElementById('sCurveWrapper');
        
        listContainer.innerHTML = '';
        calContainer.style.display = 'none';
        pieWrapper.style.display = 'block';
        sCurveWrapper.style.display = 'none';

        const selectedDateStr = document.getElementById('dateSelector').value || getLocalYYYYMMDD();
        const selectedDate = new Date(selectedDateStr);

        if (currentView === 'day' && !isStartHourManuallySet) {
            dayStartHour = getAutoStartHour(selectedDateStr);
            document.getElementById('startHourInput').value = dayStartHour;
        }

        const colorP1 = getThemeColor('--p1'); const colorP2 = getThemeColor('--p2');
        const colorP3 = getThemeColor('--p3'); const colorP4 = getThemeColor('--p4');
        const colorRem = getThemeColor('--rem'); const colorLine = getThemeColor('--chart-line');
        const colorIdeal = getThemeColor('--chart-ideal');

        if (currentView === 'day') {
            sCurveWrapper.style.display = 'block';
            const daySess = sessions.filter(s => s && s.date && getLocalYYYYMMDD(parseSessionDate(s.date)) === selectedDateStr);
            
            const data = [1,2,3,4].map(p => {
                let pSec = daySess.filter(s => parseInt(s.priority) === p).reduce((a,s) => a+(parseFloat(s.duration) || 0), 0);
                if (isRunning && currentPriority === p && selectedDateStr === getLocalYYYYMMDD()) pSec += elapsed / 1000;
                return pSec;
            });
            const totalWorked = data.reduce((a,b)=>a+b,0);
            const goalSeconds = dailyGoalHours * 3600;
            data.push(Math.max(0, goalSeconds - totalWorked));

            myChart = new Chart(ctx, {
                type: 'pie',
                data: {
                    labels: ['P1', 'P2', 'P3', 'P4', 'Reste'],
                    datasets: [{ data: data.map(s => (s/60).toFixed(1)), backgroundColor: [colorP1, colorP2, colorP3, colorP4, colorRem] }]
                },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'right', labels: { color: getThemeColor('--text'), boxWidth: 8, font: { size: 8 } } } } }
            });

            // S-Curve
            const labels = [];
            const theoreticalData = [];
            const actualData = [];
            let lunchIncluded = (dayStartHour < 12.5);
            let theoreticalTotalElapsed = (dailyGoalHours / concentrationRatio) + (lunchIncluded ? 1 : 0);
            let endHour = Math.max(dayStartHour + theoreticalTotalElapsed + 0.5, 18);

            for (let t = dayStartHour; t <= endHour; t += 0.5) {
                let h = Math.floor(t); let m = (t % 1 === 0) ? "00" : "30";
                labels.push(`${String(h).padStart(2, '0')}:${m}`);
                theoreticalData.push(getTheoreticalFocusAt(t));

                const limitTime = new Date(selectedDate);
                limitTime.setHours(h, (t % 1 === 0) ? 0 : 30, 0, 0);
                
                let activeSecAtT = 0;
                if (isRunning && selectedDateStr === getLocalYYYYMMDD()) {
                    const now = new Date();
                    if (startTime < limitTime.getTime()) {
                        const sessionEndInInterval = Math.min(now.getTime(), limitTime.getTime());
                        activeSecAtT = Math.max(0, (sessionEndInInterval - startTime) / 1000);
                    }
                }

                const actualSecAtT = daySess.filter(s => s && s.date && parseSessionDate(s.date) <= limitTime).reduce((sum, s) => sum + (parseFloat(s.duration) || 0), 0) + activeSecAtT;

                if (selectedDateStr === getLocalYYYYMMDD() && limitTime > new Date()) {
                    actualData.push(null);
                } else {
                    actualData.push(actualSecAtT / 3600);
                }
            }

            sCurveChart = new Chart(sCtx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [
                        { label: 'Réalisé', data: actualData, borderColor: colorLine, backgroundColor: 'rgba(120,120,120,0.05)', borderWidth: 1.5, fill: true, tension: 0.1 },
                        { label: 'Idéal', data: theoreticalData, borderColor: colorIdeal, borderDash: [4, 4], borderWidth: 1, fill: false, tension: 0 }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        x: { ticks: { color: getThemeColor('--text'), font: { size: 7 } }, grid: { display: false } },
                        y: { ticks: { color: getThemeColor('--text'), font: { size: 7 } }, grid: { color: getThemeColor('--border') } }
                    },
                    plugins: { legend: { display: false } }
                }
            });

            // HISTORIQUE DES SESSIONS
            if (daySess.length > 0) {
                listContainer.innerHTML = '<h4 style="margin:10px 0 5px 0; font-size:12px;">Sessions du jour</h4>';
                daySess.forEach((s, idx) => {
                    const parsedDate = parseSessionDate(s.date);
                    if (parsedDate) {
                        const timeStr = parsedDate.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                        listContainer.innerHTML += `
                            <div class="session-item">
                                <span>Session #${idx+1} à ${timeStr}</span>
                                <span class="session-priority" style="background: var(--p${s.priority})">P${s.priority}</span>
                                <span style="font-weight:bold;">${formatTaskWorked(parseFloat(s.duration))}</span>
                                <div style="display:flex; gap: 4px;">
                                    <button onclick="editSession('${s.date}')" style="background:none; border:none; color:var(--chart-line); font-weight:bold; cursor:pointer; padding:0 4px;">✏️</button>
                                    <button onclick="deleteSession('${s.date}')" style="background:none; border:none; color:var(--p1); font-weight:bold; cursor:pointer; padding:0 4px;">✕</button>
                                </div>
                            </div>`;
                    }
                });
            } else {
                listContainer.innerHTML = '<div style="font-size:11px; color:var(--muted); text-align:center;">Aucune session enregistrée pour ce jour.</div>';
            }

        } else if (currentView === 'week') {
            const labels = [];
            const dataP1 = [], dataP2 = [], dataP3 = [], dataP4 = [];
            for (let i = 6; i >= 0; i--) {
                const d = new Date(selectedDate); d.setDate(selectedDate.getDate() - i);
                labels.push(d.toLocaleDateString([], { weekday: 'short', day: 'numeric' }));
                const daySess = sessions.filter(s => s && s.date && parseSessionDate(s.date).toDateString() === d.toDateString());
                dataP1.push(daySess.filter(s => parseInt(s.priority) === 1).reduce((a,s)=>a+(parseFloat(s.duration) || 0),0)/3600);
                dataP2.push(daySess.filter(s => parseInt(s.priority) === 2).reduce((a,s)=>a+(parseFloat(s.duration) || 0),0)/3600);
                dataP3.push(daySess.filter(s => parseInt(s.priority) === 3).reduce((a,s)=>a+(parseFloat(s.duration) || 0),0)/3600);
                dataP4.push(daySess.filter(s => parseInt(s.priority) === 4).reduce((a,s)=>a+(parseFloat(s.duration) || 0),0)/3600);
            }

            myChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [
                        { label: 'P1', data: dataP1, backgroundColor: colorP1 }, { label: 'P2', data: dataP2, backgroundColor: colorP2 },
                        { label: 'P3', data: dataP3, backgroundColor: colorP3 }, { label: 'P4', data: dataP4, backgroundColor: colorP4 }
                    ]
                },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    scales: {
                        x: { stacked: true, grid: { display: false }, ticks: { color: getThemeColor('--text'), font: { size: 8 } } },
                        y: { stacked: true, grid: { color: getThemeColor('--border') }, ticks: { color: getThemeColor('--text'), font: { size: 8 } } }
                    },
                    plugins: { legend: { display: false } }
                }
            });
        } else if (currentView === 'month') {
            pieWrapper.style.display = 'none';
            calContainer.style.display = 'block';
            const grid = document.getElementById('monthGrid');
            grid.innerHTML = '';
            
            const year = selectedDate.getFullYear(), month = selectedDate.getMonth();
            const firstDayIndex = new Date(year, month, 1).getDay(); 
            const startingOffset = (firstDayIndex + 6) % 7;
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            
            for (let x = 0; x < startingOffset; x++) grid.innerHTML += `<div style="height:32px;"></div>`;
            const goalSeconds = dailyGoalHours * 3600;

            for (let day = 1; day <= daysInMonth; day++) {
                const dayDate = new Date(year, month, day);
                const daySess = sessions.filter(s => s && s.date && parseSessionDate(s.date).toDateString() === dayDate.toDateString());
                let gradientStr = 'var(--rem)';
                const totalWorked = daySess.reduce((acc, s) => acc + (parseFloat(s.duration) || 0), 0);

                if (totalWorked > 0) {
                    let acc = 0;
                    const segments = [1,2,3,4].map(p => {
                        const dur = daySess.filter(s => parseInt(s.priority) === p).reduce((a,s)=>a+(parseFloat(s.duration) || 0),0);
                        if (dur === 0) return null;
                        const start = (acc / Math.max(goalSeconds, totalWorked)) * 100;
                        acc += dur;
                        const end = (acc / Math.max(goalSeconds, totalWorked)) * 100;
                        return `var(--p${p}) ${start}% ${end}%`;
                    });

                    const validSegments = [];
                    for(let k=0; k<segments.length; k++) {
                        if (segments[k] !== null) validSegments.push(segments[k]);
                    }

                    if (totalWorked < goalSeconds) validSegments.push(`var(--rem) ${(totalWorked / goalSeconds) * 100}% 100%`);
                    gradientStr = `conic-gradient(${validSegments.join(', ')})`;
                }

                grid.innerHTML += `
                    <div class="day-cell">
                        <span class="day-num">${day}</span>
                        <div class="mini-pie" style="background: ${gradientStr};"></div>
                    </div>`;
            }
        }
    }

    // --- NOUVELLES FONCTIONS DE GESTION DE TÂCHES HISTORIQUES & REPORTS ---
    let currentTaskView = 'stats';

    function getTomorrowDateStr() {
        const d = new Date();
        d.setDate(d.getDate() + 1);
        return getLocalYYYYMMDD(d);
    }

    function exportData() {
        const data = {
            focusShowCompletedTodos: localStorage.getItem('focusShowCompletedTodos'),
            focusSessions: localStorage.getItem('focusSessions'),
            focusDailyGoal: localStorage.getItem('focusDailyGoal'),
            focusStartHour: localStorage.getItem('focusStartHour'),
            focusRatio: localStorage.getItem('focusRatio'),
            focusTodos: localStorage.getItem('focusTodos'),
            focusActiveTodoId: localStorage.getItem('focusActiveTodoId'),
            focusTheme: localStorage.getItem('focusTheme')
        };
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `focus_meter_backup_${new Date().toISOString().slice(0,10)}.json`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    }

    function importData() {
        const input = document.createElement('input');
        input.type = 'file';
        input.accept = '.json';
        input.onchange = (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (evt) => {
                try {
                    const data = JSON.parse(evt.target.result);
                    if (data.focusSessions !== undefined) {
                        for (const key in data) {
                            if (data[key] !== null) {
                                localStorage.setItem(key, data[key]);
                            }
                        }
                        alert("Données importées avec succès ! Rechargement de la page...");
                        location.reload();
                    } else {
                        alert("Format de fichier invalide.");
                    }
                } catch (err) {
                    alert("Erreur lors de l'importation : " + err.message);
                }
            };
            reader.readAsText(file);
        };
        input.click();
    }

    function postponeTodo(id) {
        const t = todos.find(todo => todo.id === id);
        if (!t) return;
        t.postponeCount = (t.postponeCount || 0) + 1;
        t.postponedUntil = getTomorrowDateStr();
        localStorage.setItem('focusTodos', JSON.stringify(todos));
        
        if (activeTodoId === id) {
            activeTodoId = null;
            localStorage.setItem('focusActiveTodoId', activeTodoId);
        }
        
        if (t.postponeCount >= 3) {
            alert(`🗑️ DECHET MENTAL : La tâche "${t.text}" a été reportée 3 fois ou plus ! Elle apparaît désormais comme un déchet qu'il faut absolument éliminer de votre esprit d'ici 24 heures (la subdiviser, la déléguer ou la supprimer).`);
        }
        
        renderTodos();
        if (document.getElementById('statsView').style.display === 'flex' && document.getElementById('tasksAnalysisSection').style.display === 'flex') {
            renderTaskView();
        }
    }

    function splitTodo(id) {
        const t = todos.find(todo => todo.id === id);
        if (!t) return;
        const input = prompt(`Diviser "${t.text}" en plusieurs sous-tâches (séparez par des virgules) :`, `${t.text} - Partie 1, ${t.text} - Partie 2`);
        if (input) {
            const parts = input.split(',').map(s => s.trim()).filter(Boolean);
            if (parts.length > 0) {
                const partEstimate = Math.max(0.25, Math.round((t.estimate / parts.length) * 4) / 4);
                parts.forEach(part => {
                    todos.push({
                        id: Date.now().toString() + Math.random(),
                        text: part,
                        priority: t.priority,
                        estimate: partEstimate,
                        worked: 0,
                        completed: false,
                        postponeCount: 0,
                        postponedUntil: null
                    });
                });
                todos = todos.filter(todo => todo.id !== id);
                if (activeTodoId === id) activeTodoId = null;
                localStorage.setItem('focusTodos', JSON.stringify(todos));
                localStorage.setItem('focusActiveTodoId', activeTodoId);
                renderTodos();
                if (document.getElementById('statsView').style.display === 'flex') {
                    renderTaskView();
                }
            }
        }
    }

    function delegateTodo(id) {
        const t = todos.find(todo => todo.id === id);
        if (!t) return;
        const newText = prompt(`Modifier / Déléguer la tâche "${t.text}" :`, t.text);
        if (newText !== null) {
            t.text = newText.trim() || t.text;
            t.postponeCount = 0; // On réinitialise car elle a changé de forme
            t.postponedUntil = null;
            localStorage.setItem('focusTodos', JSON.stringify(todos));
            renderTodos();
            if (document.getElementById('statsView').style.display === 'flex') {
                renderTaskView();
            }
        }
    }

    function setAnalysisTab(tab) {
        const focusBtn = document.getElementById('analysis-focus-btn');
        const tasksBtn = document.getElementById('analysis-tasks-btn');
        const focusSection = document.getElementById('focusAnalysisSection');
        const tasksSection = document.getElementById('tasksAnalysisSection');
        
        if (tab === 'focus') {
            focusBtn.classList.add('active');
            tasksBtn.classList.remove('active');
            focusSection.style.display = 'flex';
            tasksSection.style.display = 'none';
            renderCharts();
        } else {
            focusBtn.classList.remove('active');
            tasksBtn.classList.add('active');
            focusSection.style.display = 'none';
            tasksSection.style.display = 'flex';
            renderTaskView();
        }
    }

    function changeTaskView(view) {

        ['stats', 'history', 'postponed'].forEach(v => {
            const btn = document.getElementById(`task-tab-${v}`);
            if (v === view) btn.classList.add('active');
            else btn.classList.remove('active');
        });

    function reactivateTodo(id) {
        const t = todos.find(todo => todo.id === id);

            t.postponedUntil = null;

                html += `
                    <div style="display:flex; justify-content:space-between; align-items:center; background:var(--rem); padding:6px 8px; border-radius:6px; border:1px solid var(--border); font-size:10px;">
                        <div style="display:flex; flex-direction:column; overflow:hidden; gap:1px; flex-grow:1; text-align:left;">
                            <span style="text-decoration:line-through; color:var(--muted); text-overflow:ellipsis; overflow:hidden; white-space:nowrap; max-width:180px;">${t.text}</span>
                            <span style="font-size:7px; color:var(--muted);">Fait en ${formatTaskWorked(t.worked)}</span>
                        </div>
                        <div style="display:flex; align-items:center; gap:4px;">
                            <span class="session-priority" style="background:var(--p${t.priority}); font-size:8px; padding:1px 4px; border-radius:3px;">P${t.priority}</span>
                            <button class="icon-btn delete-btn" onclick="event.stopPropagation(); deleteTodoAndRefreshHistory('${t.id}')">✕</button>
                        </div>
                    </div>
                `;
            });
            html += '</div>';
            container.innerHTML = html;
            
        } else if (currentTaskView === 'postponed') {
            const postponedTodos = todos.filter(t => !t.completed && (t.postponeCount > 0 || (t.postponedUntil && t.postponedUntil > getLocalYYYYMMDD())));
            if (postponedTodos.length === 0) {
                container.innerHTML = `<div style="text-align: center; color: var(--muted); font-size: 10px; padding: 20px;">Aucune tâche reportée.</div>`;
                return;
            }
            
            let html = '<div style="display:flex; flex-direction:column; gap:4px; max-height:280px; overflow-y:auto; padding-right:2px;">';
            postponedTodos.forEach(t => {
                const isWaste = t.postponeCount >= 3;
                const cardBg = isWaste ? 'linear-gradient(135deg, #2c1a1a 0%, #1e1e1e 100%)' : 'var(--rem)';
                const borderCol = isWaste ? '#ff4d4d' : 'var(--border)';
                const textColor = isWaste ? '#ff4d4d' : 'var(--text)';
                
                html += `
                    <div style="display:flex; flex-direction:column; background:${cardBg}; padding:8px; border-radius:6px; border:1px solid ${borderCol}; font-size:10px; gap:4px; text-align:left;">
                        <div style="display:flex; justify-content:space-between; align-items:center;">
                            <div style="display:flex; flex-direction:column; overflow:hidden; gap:2px; flex-grow:1;">
                                <span style="font-weight:bold; color:${textColor}; text-overflow:ellipsis; overflow:hidden; white-space:nowrap; max-width:180px;">
                                    ${isWaste ? '⚠️ ' : ''}${t.text}
                                </span>
                                <span style="font-size:8px; color:var(--muted);">Reporté : ${t.postponeCount} fois ${t.postponedUntil ? `(jusqu'au ${t.postponedUntil})` : ''}</span>
                            </div>
                            <span class="session-priority" style="background:var(--p${t.priority})">P${t.priority}</span>
                        </div>
                        <div style="display:flex; gap:4px; justify-content:flex-end; margin-top:2px;">
                            <button class="waste-action-btn" onclick="event.stopPropagation(); splitTodoAndRefresh('${t.id}')">✂️ Diviser</button>
                            <button class="waste-action-btn" onclick="event.stopPropagation(); delegateTodoAndRefresh('${t.id}')">✏️ Modif/Déléguer</button>
                            <button class="waste-action-btn" onclick="event.stopPropagation(); reactivateTodo('${t.id}')">⚡ Réactiver</button>
                            <button class="waste-action-btn" onclick="event.stopPropagation(); deleteTodoAndRefreshPostponed('${t.id}')">🗑️ Jeter</button>
                        </div>
                    </div>
                `;
            });
            html += '</div>';
            container.innerHTML = html;
        }
    }

    // Attachment de nos nouvelles fonctions à window pour qu'elles soient appelées depuis le HTML
    window.exportData = exportData;
    window.importData = importData;
    window.postponeTodo = postponeTodo;
    window.splitTodo = splitTodo;
    window.delegateTodo = delegateTodo;
    window.setAnalysisTab = setAnalysisTab;
    window.changeTaskView = changeTaskView;
    window.deleteTodoAndRefreshHistory = deleteTodoAndRefreshHistory;
    window.deleteTodoAndRefreshPostponed = deleteTodoAndRefreshPostponed;
    window.splitTodoAndRefresh = splitTodoAndRefresh;
    window.delegateTodoAndRefresh = delegateTodoAndRefresh;
    window.reactivateTodo = reactivateTodo;

</script>
</body>
</html>
